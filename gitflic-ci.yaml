stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

android_unsigned:
  stage: build
  tags: [fleetci]
  image:
    name: '$FLEET_CI_IMAGE'
    pull_policy: never
  script:
    - python3 -m unittest discover -s ci/tests -v
    - python3 ci/fleetci.py android-unsigned --provider gitflic --tag "$CI_COMMIT_TAG"
  artifacts:
    when: always
    paths: [dist/unsigned/]

android_sign_release:
  stage: release
  tags: [fleetsigning]
  image:
    name: '$FLEET_SIGNING_IMAGE'
    pull_policy: never
  needs: [android_unsigned]
  variables:
    FLEET_SIGNING_DIRECTORY: /run/fleet-signing
    FLEET_GPG_PRIVATE_KEY_FILE: /run/fleet-signing/ci-bot-private.asc
  script:
    - python3 ci/fleetci.py release --provider gitflic --tag "$CI_COMMIT_TAG"
  artifacts:
    when: always
    paths: [dist/]
